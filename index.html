<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Маникюр PWA</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#111827; color:white; }
  .video-wrap { position:relative; width:100%; height:calc(100vh - 80px); background:black; }
  video,canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #videoCanvas { z-index:1 }
  #effectsCanvas { z-index:2; pointer-events:none }
  #chickenCanvas { z-index:3; pointer-events:none }
  /* нижняя панель */
  .bottom-bar {
    position:fixed; bottom:0; left:0; right:0; height:80px;
    background:#1f2937; display:flex; justify-content:space-around; align-items:center;
    border-top:1px solid #374151;
  }
  .btn { display:flex; flex-direction:column; align-items:center; color:#9ca3af; font-size:.8rem; }
  .btn svg { width:28px; height:28px; margin-bottom:4px; fill:#9ca3af; }
  .btn.active, .btn:hover { color:#7dd3fc; }
  .btn.active svg, .btn:hover svg { fill:#7dd3fc; }
  #chickenLoader { display:none; position:fixed; top:0; left:0; right:0; background:#1f2937; padding:10px; z-index:10 }
  #downloads { position:fixed; top:10px; right:10px; font-size:.8rem; }
  #downloads a { color:#7dd3fc; display:block; }
</style>
</head>
<body>

<!-- скрытый загрузчик курицы -->
<div id="chickenLoader">
  <input type="text" id="chickenUrl" placeholder="URL спрайта курицы" style="width:60%">
  <button id="loadChickenUrl">Загрузить</button>
  <input type="file" id="chickenFile" accept="image/*">
</div>

<div class="video-wrap">
  <video id="video" playsinline muted></video>
  <canvas id="videoCanvas"></canvas>
  <canvas id="effectsCanvas"></canvas>
  <canvas id="chickenCanvas"></canvas>
</div>

<div id="downloads"></div>

<!-- нижняя панель -->
<div class="bottom-bar">
  <div class="btn" id="btnShot"><svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 100 10 5 5 0 000-10z"/><path d="M5 7h2l1-2h8l1 2h2v12H5z"/></svg>Снимок</div>
  <div class="btn" id="btnShare"><svg viewBox="0 0 24 24"><path d="M4 12v-2l8-5v4h8v6h-8v4z"/></svg>Поделиться</div>
  <div class="btn" id="btnEffect"><svg viewBox="0 0 24 24"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5z"/></svg>Эффекты</div>
  <div class="btn" id="btnChicken"><svg viewBox="0 0 24 24"><path d="M12 4a6 6 0 016 6c0 2-1 3-2 4l2 6H6l2-6c-1-1-2-2-2-4a6 6 0 016-6z"/></svg>Курица</div>
  <div class="btn" id="btnInstall"><svg viewBox="0 0 24 24"><path d="M12 2v14l4-4h-3V2z"/><path d="M4 20h16v2H4z"/></svg>Уст.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script>
/* ====== базовая логика ====== */
// камера + canvas
const video=document.getElementById('video'), vcan=document.getElementById('videoCanvas'), ecan=document.getElementById('effectsCanvas'), ccan=document.getElementById('chickenCanvas');
const vctx=vcan.getContext('2d'), ectx=ecan.getContext('2d'), cctx=ccan.getContext('2d');
let stream=null; async function startCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
  video.srcObject=stream; await video.play();
  [vcan,ecan,ccan].forEach(c=>{c.width=video.videoWidth;c.height=video.videoHeight;});
  requestAnimationFrame(loop);
} startCamera();

/* ====== эффекты ====== */
let effect="none"; document.getElementById('btnEffect').onclick=()=>{
  const opts=["none","fire","snow","hearts"]; const i=opts.indexOf(effect); effect=opts[(i+1)%opts.length];
  alert("Эффект: "+effect);
};

/* ====== курица ====== */
let chickenOn=false; document.getElementById('btnChicken').onclick=()=>chickenOn=!chickenOn;
let chickenImg=new Image(); chickenImg.src="icon-192.png"; const chicken={x:100,y:100,dir:1};
function drawChicken(dt){ if(!chickenOn) return; chicken.x+=dt*50*chicken.dir; if(chicken.x>ccan.width-50) chicken.dir=-1; if(chicken.x<50) chicken.dir=1;
  cctx.drawImage(chickenImg,chicken.x-48,chicken.y-48,96,96); }

/* ====== руки (ногти) ====== */
const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`}); hands.setOptions({maxNumHands:1}); hands.onResults(res=>{
  vctx.clearRect(0,0,vcan.width,vcan.height); vctx.drawImage(res.image,0,0,vcan.width,vcan.height);
  if(res.multiHandLandmarks){ drawConnectors(vctx,res.multiHandLandmarks[0],HAND_CONNECTIONS,{color:'#7dd3fc'}); }
});

/* ====== основной цикл ====== */
let last=performance.now(); async function loop(){
  const now=performance.now(),dt=(now-last)/1000; last=now;
  if(video.readyState>=2) await hands.send({image:video});
  ectx.clearRect(0,0,ecan.width,ecan.height);
  cctx.clearRect(0,0,ccan.width,ccan.height); drawChicken(dt);
  requestAnimationFrame(loop);
}

/* ====== снимки/шаринг ====== */
let lastShot=null;
document.getElementById('btnShot').onclick=()=>{const out=document.createElement('canvas');out.width=vcan.width;out.height=vcan.height;const g=out.getContext('2d');g.drawImage(vcan,0,0);g.drawImage(ecan,0,0);g.drawImage(ccan,0,0);lastShot=out.toDataURL("image/png");const a=document.createElement('a');a.href=lastShot;a.download="nails.png";a.textContent="скачать";document.getElementById('downloads').prepend(a);};
document.getElementById('btnShare').onclick=async()=>{if(!lastShot)return alert("Сделай снимок");const blob=await (await fetch(lastShot)).blob();const file=new File([blob],"nails.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:"Маникюр"});else{const a=document.createElement('a');a.href=lastShot;a.download="nails.png";a.click();}};

/* ====== установка ====== */
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('btnInstall').onclick=()=>{deferredPrompt.prompt();deferredPrompt=null;};});

/* ====== сервис-воркер ====== */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}

/* ====== секретный загрузчик ====== */
let taps=0,timer=null;document.body.addEventListener('click',()=>{taps++;clearTimeout(timer);timer=setTimeout(()=>taps=0,800);if(taps>=6){document.getElementById('chickenLoader').style.display='block';taps=0;}});
document.getElementById('loadChickenUrl').onclick=()=>{const url=document.getElementById('chickenUrl').value;const img=new Image();img.onload=()=>chickenImg=img;img.src=url;};
document.getElementById('chickenFile').onchange=e=>{const f=e.target.files[0];if(f){const img=new Image();img.onload=()=>chickenImg=img;img.src=URL.createObjectURL(f);}};
</script>
</body>
</html>
