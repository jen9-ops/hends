<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Маникюр PWA</title>
<meta name="theme-color" content="#0f1220">
<link rel="manifest" href="manifest.json">
<style>
  body{margin:0;font-family:system-ui;background:#0f1220;color:#eef2fc}
  .wrap{max-width:1000px;margin:auto;padding:12px;display:grid;gap:12px}
  .card{background:#1b2346;border-radius:14px;padding:14px}
  .video-wrap{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .btn{padding:10px 14px;border:none;border-radius:12px;font-weight:700;cursor:pointer;background:#4da3ff;color:#0f1220}
  .btn.warn{background:#ff6a6a;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Маникюр: PWA</h1>
    <div class="video-wrap">
      <video id="video" playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>

    <div>
      <label><input type="checkbox" id="mirrorFront"> Зеркалить фронтальную</label>
      <button class="btn" id="switchCam">Фронт/Задняя</button>
    </div>

    <div class="controls">
      <button class="btn" id="shot">📸 Снимок</button>
      <button class="btn" id="share">📲 Поделиться</button>
      <button class="btn" id="installBtn" style="display:none">⬇️ Установить</button>
      <button class="btn warn" id="reloadApp" style="display:none">🔄 Обновить</button>
    </div>
    <div id="downloads"></div>
  </div>
</div>

<!-- Mediapipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const switchCamBtn=document.getElementById('switchCam'),mirrorFront=document.getElementById('mirrorFront');
const shotBtn=document.getElementById('shot'),shareBtn=document.getElementById('share'),downloads=document.getElementById('downloads');
const installBtn=document.getElementById('installBtn'),reloadBtn=document.getElementById('reloadApp');

let facingMode='user',stream=null,isMirror=false,lastShot=null;
mirrorFront.addEventListener('change',()=>isMirror=mirrorFront.checked);
switchCamBtn.addEventListener('click',()=>{facingMode=facingMode==='user'?'environment':'user';startCamera();});

async function startCamera(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode},audio:false});
  video.srcObject=stream;await video.play();
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  requestAnimationFrame(loop);
}
video.addEventListener('loadedmetadata',()=>{canvas.width=video.videoWidth;canvas.height=video.videoHeight});

/* Mediapipe */
const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:0.7,minTrackingConfidence:0.6});
hands.onResults(onResults);
const FINGER_TIPS=[4,8,12,16,20];
function getNailPolygon(lm,i){const tip=lm[i],dip=lm[i-1],pip=lm[i-2];if(!tip||!dip||!pip)return null;const tx=tip.x*canvas.width,ty=tip.y*canvas.height,dx=dip.x*canvas.width,dy=dip.y*canvas.height,px=pip.x*canvas.width,py=pip.y*canvas.height;const vx=tx-px,vy=ty-py,len=Math.hypot(vx,vy)||1;const nx=-vy/len*10,ny=vx/len*10;return[{x:dx+nx,y:dy+ny},{x:dx-nx,y:dy-ny},{x:tx-nx,y:ty-ny},{x:tx+nx,y:ty+ny}];}
function pathFromPoly(p){if(!p)return null;const path=new Path2D();path.moveTo(p[0].x,p[0].y);for(let j=1;j<p.length;j++)path.lineTo(p[j].x,p[j].y);path.closePath();return path;}
function fillNail(poly){const path=pathFromPoly(poly);if(!path)return;ctx.save();ctx.clip(path);ctx.fillStyle="rgba(255,100,200,0.6)";ctx.fill(path);ctx.restore();ctx.strokeStyle='white';ctx.stroke(path);}
function onResults(res){ctx.clearRect(0,0,canvas.width,canvas.height);if(isMirror&&facingMode==='user'){ctx.save();ctx.scale(-1,1);ctx.drawImage(res.image,-canvas.width,0,canvas.width,canvas.height);ctx.restore();}else{ctx.drawImage(res.image,0,0,canvas.width,canvas.height);}if(res.multiHandLandmarks&&res.multiHandLandmarks.length){let lm=res.multiHandLandmarks[0];if(isMirror&&facingMode==='user'){lm=lm.map(p=>({x:1-p.x,y:p.y,z:p.z}));}FINGER_TIPS.forEach(i=>{const poly=getNailPolygon(lm,i);if(poly)fillNail(poly);});}}
async function loop(){if(video.readyState>=2){await hands.send({image:video});}requestAnimationFrame(loop);}
startCamera();

/* Снимок / Поделиться */
shotBtn.onclick=()=>{lastShot=canvas.toDataURL('image/png');const a=document.createElement('a');a.href=lastShot;a.download='nails.png';a.textContent='Скачать снимок';downloads.prepend(a);};
shareBtn.onclick=async()=>{if(!lastShot)return alert('Сначала сделай снимок');const blob=await(await fetch(lastShot)).blob();const file=new File([blob],'nails.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Маникюр'});}else{const a=document.createElement('a');a.href=lastShot;a.download='nails.png';a.click();}};

/* Установка */
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='inline-block';});
installBtn.addEventListener('click',async()=>{deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none';});

/* Service Worker с обновлением */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    if(reg.waiting)showUpdate();
    reg.addEventListener('updatefound',()=>{
      const newSW=reg.installing;
      newSW.addEventListener('statechange',()=>{
        if(newSW.state==='installed'&&navigator.serviceWorker.controller)showUpdate();
      });
    });
  });
  let refreshing;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return;window.location.reload();refreshing=true;
  });
}
function showUpdate(){reloadBtn.style.display='inline-block';reloadBtn.onclick=()=>{navigator.serviceWorker.getRegistration().then(reg=>{if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});});};}
</script>
</body>
</html>
